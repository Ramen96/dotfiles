################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor= DP-4, 3840x2160@160, 0x0, 1.25


##############
### CURSOR ###
##############

exec-once = hyprctl setcursor Bibata-Modern-Classic 24

xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
$browser = brave
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

# 1. Essential D-Bus/Systemd environment sync
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Authentication and Secrets
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets

# 3. UI Elements
exec-once = waybar & hyprpaper & hypridle & nm-applet --indicator & swaync

#############################
### ENVIRONMENT VARIABLES ###
#############################

source = ~/.config/hypr/hyprConf/env.conf

###################################################
### Environment for xdg-desktop-portal-hyprland ###
###################################################
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

##############
### NVIDIA ###
##############

source = ~/.config/hypr/hyprConf/nvidia.conf


#####################
### LOOK AND FEEL ###
#####################

source = ~/.config/hypr/hyprConf/look-and-feel.conf

#############
### INPUT ###
#############

source = ~/.config/hypr/hyprConf/input.conf

###################
### KEYBINDINGS ###
###################

source = ~/.config/hypr/hyprConf/keyBindings.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

source = ~/.config/hypr/hyprConf/window-and-workspace.conf
